<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donegal FIDS · Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="map.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__code">EIDL</span>
      <span class="topbar__name">Live Map</span>
      <span class="topbar__live"><span class="live-dot"></span>LIVE</span>
    </div>
    <nav class="topbar__nav">
      <a href="/admin" class="topbar__link">Control panel</a>
      <a href="/" target="_blank" rel="noopener" class="topbar__link">Open display ↗</a>
      <a href="/api/logout" class="topbar__link topbar__link--logout">Log out</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="side">
      <header class="side__head">
        <strong>Live Tracking</strong>
        <span class="side__sub">54°58′N · 08°20′W</span>
        <span class="side__sub">Donegal Airport · EIDL · ADS-B</span>
      </header>

      <div class="side__status">
        <span class="dot" id="liveDot"></span>
        <span id="statusMsg">Loading…</span>
        <button class="btn" id="refreshBtn" type="button">Refresh</button>
      </div>

      <div class="section-label">Scheduled flights</div>
      <div class="tracked" id="tracked"></div>

      <div id="possibleSection" style="display:none">
        <div class="section-label section-label--amber">↓ Approaching EIDL</div>
        <div class="possible" id="possible"></div>
      </div>

    </aside>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
