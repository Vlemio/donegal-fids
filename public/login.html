<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #050607;
      background-image: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.8rem;
      font-family: 'Barlow', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    img.logo {
      height: 48px;
      object-fit: contain;
      opacity: 0.9;
    }

    .card {
      width: min(320px, 90vw);
      background: #0c0f10;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 28px 64px rgba(0,0,0,0.65);
    }

    .card__bar {
      height: 4px;
      background: #ffc31e;
    }

    .card__body {
      padding: 1.6rem 1.4rem 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8b9897;
    }

    input {
      background: #070a0b;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 5px;
      padding: 0.62rem 0.85rem;
      color: #f3f6f6;
      font-family: inherit;
      font-size: 0.92rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }
    input:focus {
      border-color: #ffc31e;
      box-shadow: 0 0 0 3px rgba(255,195,30,0.15);
    }
    input::placeholder { color: rgba(139,152,151,0.4); }

    .error {
      font-size: 0.75rem;
      color: #ff5b4d;
      background: rgba(255,91,77,0.07);
      border: 1px solid rgba(255,91,77,0.18);
      border-radius: 4px;
      padding: 0.4rem 0.7rem;
      display: none;
      text-align: center;
    }
    .error.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.68rem;
      background: #ffc31e;
      color: #07090a;
      border: none;
      border-radius: 5px;
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.12s, transform 0.08s;
    }
    button[type="submit"]:hover  { opacity: 0.88; }
    button[type="submit"]:active { opacity: 0.72; transform: scale(0.99); }
  </style>
</head>
<body>

  <img class="logo" src="logo.png" alt="" />

  <div class="card">
    <div class="card__bar"></div>
    <div class="card__body">
      <form method="POST" action="/api/auth" style="display:contents">
        <div class="field">
          <label for="user">Username</label>
          <input id="user" name="username" type="text"
                 autocomplete="username" placeholder="donegal" required />
        </div>
        <div class="field">
          <label for="pass">Password</label>
          <input id="pass" name="password" type="password"
                 autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <p class="error" id="err">Incorrect — try again.</p>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const err    = params.get('error');
    const errEl  = document.getElementById('err');
    if (err === 'locked') {
      const mins = params.get('mins') || 15;
      errEl.textContent = `Too many attempts — try again in ${mins} min.`;
      errEl.classList.add('visible');
      document.querySelector('button[type="submit"]').disabled = true;
    } else if (err) {
      errEl.classList.add('visible');
    }
  </script>
</body>
</html>
