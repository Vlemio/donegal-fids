<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FIDS Control · Donegal Airport</title>
  <link rel="stylesheet" href="admin.css?v=5">
</head>
<body>

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__code">EIDL</span>
      <span class="topbar__name">FIDS Control</span>
    </div>
    <nav class="topbar__nav">
      <a href="/map" class="topbar__link">Live map</a>
      <a href="/" target="_blank" rel="noopener" class="topbar__link">Open display ↗</a>
      <a href="/api/logout" class="topbar__link topbar__link--logout">Log out</a>
    </nav>
  </header>

  <main class="wrap">

    <!-- ─── 1. Live board ─────────────────────────────── -->
    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title">✈ What's on the board</h2>
        <span class="panel__updated" id="lastUpdate">Loading…</span>
      </div>
      <div class="board-grid">
        <div class="board-col">
          <div class="col-label col-label--dep">↑ Departures</div>
          <div id="depList" class="board-list"></div>
        </div>
        <div class="board-col">
          <div class="col-label col-label--arr">↓ Arrivals</div>
          <div id="arrList" class="board-list"></div>
        </div>
      </div>
    </section>

    <!-- ─── 2. Scheduled flights ──────────────────────── -->
    <section class="panel panel--sched">
      <button class="collapse-btn" id="schedToggle">
        <span>✏ Edit Scheduled Flights</span>
        <span id="schedArrow">▼</span>
      </button>
      <div id="schedPanel" hidden>
        <div id="schedContent" class="sched-content"></div>
      </div>
    </section>

  </main>

  <!-- ─── Modal: schedule editor ──────────────────────── -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">Edit scheduled flight</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <input type="hidden" id="f_id">
      <div class="form-grid">
        <label class="field">
          <span>Type</span>
          <select id="f_type">
            <option value="departure">↑ Departure</option>
            <option value="arrival">↓ Arrival</option>
          </select>
        </label>
        <label class="field">
          <span>Time (HH:MM)</span>
          <input type="text" id="f_time" placeholder="14:30">
        </label>
        <label class="field">
          <span>Flight number</span>
          <input type="text" id="f_flightNo" placeholder="EI3401">
        </label>
        <label class="field">
          <span>City</span>
          <input type="text" id="f_city" placeholder="Dublin">
        </label>
        <label class="field">
          <span>Airline</span>
          <input type="text" id="f_airline" placeholder="Aer Lingus">
        </label>
        <label class="field">
          <span>Airline code</span>
          <input type="text" id="f_airlineCode" placeholder="EI" maxlength="3">
        </label>
        <label class="field field--wide">
          <span>Codeshare numbers (comma separated)</span>
          <input type="text" id="f_codeshare" placeholder="BA8911, QR8254">
        </label>
        <label class="field field--wide">
          <span>ADS-B callsign (for live tracking)</span>
          <input type="text" id="f_callsign" placeholder="EAI3402">
        </label>
        <div class="callsign-warn field--wide" id="callsignWarn" style="display:none">
          ⚠ Este vuelo no está registrado en el sistema de seguimiento. Los datos en vivo no se actualizarán automáticamente. <strong>Notifica al Admin Manager.</strong>
        </div>
        <div class="field field--wide" id="fDaysWrap">
          <span>Operating days</span>
          <div class="days-row" id="f_days"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn--ghost" id="modalCancel">Cancel</button>
        <button class="btn btn--primary" id="saveSched">Save</button>
      </div>
    </div>
  </div>

  <script src="admin.js?v=5"></script>
</body>
</html>
