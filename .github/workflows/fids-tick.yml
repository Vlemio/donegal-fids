name: FIDS Tick

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:         # allow manual trigger from GitHub Actions UI

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call tick endpoint
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.TICK_SECRET }}" \
            https://donegal-fids.vercel.app/api/tick
