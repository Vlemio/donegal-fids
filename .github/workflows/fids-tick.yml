name: FIDS Tick

on:
  workflow_dispatch: # manual trigger only -- cron handled by cron-job.org

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call tick endpoint
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.TICK_SECRET }}" \
            https://donegal-fids.vercel.app/api/tick
